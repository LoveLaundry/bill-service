[project]
name = "bill-service"
version = "0.1.0"
description = "Bill Service API"
readme = "README.md"
authors = [
    { name = "DulshanSiriwardhana", email = "dulshansiriwardhanaofficial@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.5.2",
    "motor>=3.5.1",
    "dnspython>=2.6.0",
    "python-dotenv>=1.2.2",
    "cryptography>=42.0.0",
    "pyjwt>=2.7.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
    "sentry-sdk>=1.40.0",
    "openpyxl>=3.1.0",
]

[tool.vercel]
entrypoint = "api.index:app"